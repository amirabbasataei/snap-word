// Modernised for Zanjir: the upstream file pulled AGP 7.4.2 / Kotlin 1.7 from
// jcenter in its own buildscript, which no longer resolves and conflicts with
// the app's AGP. Everything else in this plugin is unmodified upstream code
// (flutter_poolakey 2.2.0+1.0.0, Apache-2.0). The JitPack repository that
// serves Poolakey is declared in android/build.gradle.kts of the app.
plugins {
    id "com.android.library"
    id "kotlin-android"
}

group 'ir.cafebazaar.flutter_poolakey'
version '2.2.0+1.0.0'

android {
    namespace 'ir.cafebazaar.flutter_poolakey'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
        buildConfigField "String", "POOLAKEY_VERSION", '"2.2.0"'
    }

    dependencies {
        implementation "com.github.cafebazaar.Poolakey:poolakey:2.2.0"
    }
}
