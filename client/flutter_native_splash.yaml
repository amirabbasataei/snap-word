# Native launch screen: plain `paper` colour (ZColors) so it hands off
# seamlessly to the Flutter SplashScreen. Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F6F1E7"
  color_dark: "#211D26"
  android: true
  ios: false
  web: false
  android_12:
    color: "#F6F1E7"
    color_dark: "#211D26"
    image: assets/splash_blank.png
    image_dark: assets/splash_blank.png
