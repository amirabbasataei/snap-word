# /opt/wordchain/compose.yml on the production host (synced by scripts/deploy_backend.sh).
# The app image is built on the developer machine and shipped with docker load;
# APP_IMAGE and all secrets live in the root-only /opt/wordchain/.env.
# Postgres is the shared infra instance (host "postgres" on the "infra" network).
name: wordchain

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:?set APP_IMAGE in /opt/wordchain/.env}
    ports:
      - "127.0.0.1:18080:8080"   # nginx is the only public entry; Docker bypasses ufw
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://wordchain:${DB_PASSWORD:?}@postgres:5432/wordchain?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      LOG_LEVEL: info
      ENV: prod
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: /secrets/fcm-service-account.json
      GAME_EPOCH_DATE: ${GAME_EPOCH_DATE:-2025-01-01}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-2h}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
    volumes:
      - ./secrets:/secrets:ro
    networks: [default, infra]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  redis_data:

networks:
  infra:
    external: true
