# /etc/nginx/sites-available/__NAME__-https — added by site-https on __DATE__.
# Certificate: certbot --cert-name __NAME__ (renewed by certbot.timer, nginx reloaded by a deploy hook).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAINS__;
    ssl_certificate     /etc/letsencrypt/live/__NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__NAME__/privkey.pem;
    access_log /var/log/nginx/__NAME__.access.log site;
    include snippets/site-__NAME__.conf;
}
