# __NAME__ locations (created by new-site on __DATE__). App: 127.0.0.1:__PORT__.
include snippets/security-headers.conf;
add_header X-Frame-Options "SAMEORIGIN" always;
client_max_body_size 10m;

# Rate-limit the login endpoint(s) — adjust the path and uncomment:
