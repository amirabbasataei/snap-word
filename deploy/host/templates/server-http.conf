# __NAME__ — __DOMAINS__. Created by new-site on __DATE__.
# Locations live in snippets/site-__NAME__.conf (shared with the HTTPS server site-https adds).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINS__;
    access_log /var/log/nginx/__NAME__.access.log site;
    include snippets/acme.conf;
    include snippets/site-__NAME__.conf;
}
