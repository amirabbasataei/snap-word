# Ham-Ketab — varaqa.ir. App: /opt/hamketab (API 127.0.0.1:13000, static /opt/hamketab/web).
# Locations: snippets/site-hamketab.conf. HTTPS: run `site-https hamketab` once DNS points here.
server {
    listen 80;
    listen [::]:80;
    server_name varaqa.ir www.varaqa.ir;
    access_log /var/log/nginx/hamketab.access.log site;
    include snippets/acme.conf;
    include snippets/site-hamketab.conf;
}
