# Drops every request whose Host matches no site (scanners, direct-IP hits).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    access_log /var/log/nginx/unknown-host.access.log site;
    return 444;
}
