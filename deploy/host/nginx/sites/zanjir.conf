# Zanjir — amirabbasataei.ir. App: /opt/wordchain (127.0.0.1:18080).
# Locations: snippets/site-zanjir.conf. HTTPS server block: sites-available/zanjir-https
# (added by `site-https zanjir`, see docs/server-runbook.md).
server {
    listen 80;
    listen [::]:80;
    server_name amirabbasataei.ir www.amirabbasataei.ir;
    access_log /var/log/nginx/zanjir.access.log site;
    include snippets/acme.conf;

    # Visitors who reached the edge over plain HTTP get sent to HTTPS. $edge_proto
    # honours X-Forwarded-Proto, so requests the edge forwards for HTTPS visitors
    # (over port 80) are not redirected. ACME challenges stay reachable on HTTP.
    set $to_https 0;
    if ($edge_proto = http) { set $to_https 1; }
    if ($request_uri ~ ^/\.well-known/acme-challenge/) { set $to_https 0; }
    if ($to_https) { return 301 https://$host$request_uri; }

    include snippets/site-zanjir.conf;
}
