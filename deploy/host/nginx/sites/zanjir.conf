# Zanjir — amirabbasataei.ir. App: /opt/wordchain (127.0.0.1:18080).
# Locations: snippets/site-zanjir.conf (shared with the legacy :8080 server below).
server {
    listen 80;
    listen [::]:80;
    server_name amirabbasataei.ir www.amirabbasataei.ir;
    access_log /var/log/nginx/zanjir.access.log site;
    include snippets/acme.conf;
    include snippets/site-zanjir.conf;
}

# HTTPS: `site-https zanjir` adds sites-available/zanjir-https (see docs/server-runbook.md).

# Legacy URL baked into installed apps: http://185.110.191.158:8080. Remove once
# every client uses the domain (then also drop 8080 from ufw).
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    access_log /var/log/nginx/zanjir-8080.access.log site;
    include snippets/site-zanjir.conf;
}
