# Shared http-level settings for every site. Managed by /opt/infra/install.sh
# (source: deploy/host/nginx in the word-chain repo) — edit there, not here.
# 00-realip-arvan.conf (generated) makes $remote_addr the real visitor IP for
# requests that arrive through ArvanCloud.

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# Scheme the visitor used at the edge (ArvanCloud may terminate TLS).
map $http_x_forwarded_proto $edge_proto { default $scheme; https https; }

# Login / OTP endpoints, keyed on the real client IP.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_status 429;

# $realip_remote_addr = the connecting peer (ArvanCloud edge or the visitor).
log_format site '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" rt=$request_time ut=$upstream_response_time '
                'peer=$realip_remote_addr';

gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
