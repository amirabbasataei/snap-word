# Common reverse-proxy headers. X-Forwarded-For is overwritten (not appended):
# nginx is the only trusted hop, so apps can take it at face value.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $edge_proto;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
# nginx adds X-Content-Type-Options itself (security-headers.conf); avoid a duplicate.
proxy_hide_header X-Content-Type-Options;
