# Zanjir locations, shared by the domain and the legacy :8080 server.
# Backend: 127.0.0.1:18080 (REST /api/v1, WebSocket /api/v1/ws, panel /admin/).
include snippets/security-headers.conf;
client_max_body_size 2m;   # avatar uploads are capped at 256 KB by the backend

location = /api/v1/admin/auth/login {
    limit_req zone=admin_login burst=5 nodelay;
    include snippets/proxy.conf;
    proxy_pass http://127.0.0.1:18080;
}
location ~ ^/api/v1/auth/(send-otp|verify-otp)$ {
    limit_req zone=auth burst=10 nodelay;
    include snippets/proxy.conf;
    proxy_pass http://127.0.0.1:18080;
}
location / {
    include snippets/proxy.conf;
    proxy_pass http://127.0.0.1:18080;
    proxy_read_timeout 3600s;   # WebSocket matches
    proxy_send_timeout 3600s;
}
