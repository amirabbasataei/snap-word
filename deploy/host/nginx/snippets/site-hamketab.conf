# Ham-Ketab locations (varaqa.ir). SPA from /opt/hamketab/web, API 127.0.0.1:13000.
# The API has no /api prefix: /api/x is proxied to /x.
include snippets/security-headers.conf;
add_header X-Frame-Options "SAMEORIGIN" always;
client_max_body_size 10m;

root /opt/hamketab/web;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}
# Hashed Vite bundles never change; index.html, sw.js etc. stay revalidated.
location /assets/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ~ ^/api/auth/otp/(request|verify)$ {
    limit_req zone=auth burst=10 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    include snippets/proxy.conf;
    proxy_pass http://127.0.0.1:13000;
}
location /api/ {
    include snippets/proxy.conf;
    proxy_pass http://127.0.0.1:13000/;
    proxy_read_timeout 60s;
}
location /docs {
    include snippets/proxy.conf;
    proxy_pass http://127.0.0.1:13000;
}
