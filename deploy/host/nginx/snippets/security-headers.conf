# Baseline headers for every site. X-Frame-Options / CSP are left to each site
# (Zanjir's backend sets its own). Note: an add_header inside a location drops
# the inherited ones, so include this snippet again in such locations.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
