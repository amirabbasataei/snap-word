# Mounts the Zanjir backend under /zanjir/ on a shared nginx server.
#   /zanjir/api/...   → backend /api/...   (REST + WebSocket)
#   /zanjir/admin/... → backend /admin/... (admin panel; built with PANEL_PREFIX=/zanjir)
#   /zanjir/health    → backend /health
# Installed on the server as /etc/nginx/snippets/zanjir.conf and included from
# the amirabbasataei.ir server block (port 80, behind ArvanCloud) and from the
# :8080 wordchain server. Needs $wc_connection_upgrade from conf.d/wordchain.conf.

location = /zanjir { return 301 /zanjir/admin/; }
location = /zanjir/admin { return 301 /zanjir/admin/; }

location /zanjir/admin/ {
    proxy_pass         http://127.0.0.1:18080/admin/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
}

location /zanjir/api/ {
    proxy_pass         http://127.0.0.1:18080/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $wc_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /zanjir/health {
    proxy_pass http://127.0.0.1:18080/health;
}
